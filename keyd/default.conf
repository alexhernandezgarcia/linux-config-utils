[ids]

*

[main]

# One-shot Shift: pressing shift and releasing it activates Shift-key combinations until next key press
shift = oneshot(shift)

# Maps capslock to escape when pressed and control when held.
capslock = overload(control, esc)

# Maps the \ key to a new layer if held (and \ itself if pressed)
# In monitor mode (`sudo keyd monitor`), pressing \ receives the name 102nd for me
102nd = overload(backslash-layer, 102nd)

[alt]

# Remaps the combination alt+capslock to capslock
capslock = capslock

# Maps the combination alt+backspace to delete
backspace = delete

# New layer under the \ key
[backslash-layer]

# Escape common patterns with \ in Vim to avoid unexpected behaviour when typed quickly
f = macro(102nd f)
b = macro(102nd b)

# Emails
# Note that " is used instead @ because key names follow typical US layout
e = macro(alexhg " e.email)
m = macro(hernanga " mila.quebec)
u = macro(alejandro.hernandez.garcia " umontreal.ca)

# Simplify Ctrl+Shift+other common combinations
c = C-S-c
v = C-S-v

# Vim movements
j = down
k = up
h = left
l = right
